services:
  node:
    build:
      context: .
      dockerfile: ./compose/node/Dockerfile
    image: frontend_$NAME$_app
    container_name: frontend_$NAME$_app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: /bin/sh -c "npm run build && npm start"